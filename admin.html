<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>MenuPlanner - Organización Semanal</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="https://kit.fontawesome.com/7745641707.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <div class="navbar">
            <h1>MenuPlanner</h1>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Login</a></li>
                    <li><a href="admin.html">Admin</a></li>
                    <li><a href="catalogo.html">Catálogo</a></li>
                    <li><a href="carrito.html">Mi Semana</a></li>
                    <li><a href="perfil.html">Mi Cuenta</a></li>
                    <li><button type="button" style="padding: 5px; background: #333; font-size:0.8em;">Modo Oscuro</button></li>
                </ul>
            </nav>
        </div>
    </header>

     <section id="admin-view">
            <h2 class="section-title">Panel de Administración - Gestión de Recetas</h2>
            <div class="admin-layout">
                <div class="admin-form">
                    <h3>Alta de Nuevo Ítem</h3>
                    <form action="#" method="POST">
                        <div class="form-group">
                            <label for="titulo">Nombre de la Receta:</label>
                            <input type="text" id="titulo" name="titulo" required>
                        </div>
                        <div class="form-group">
                            <label for="tiempo">Tiempo (min):</label>
                            <input type="number" id="tiempo" name="tiempo">
                        </div>
                        <div class="form-group">
                            <label for="ingredientes">Ingredientes:</label>
                            <textarea id="ingredientes" name="ingredientes" rows="4"></textarea>
                        </div>
                        <button type="submit">Guardar Receta</button>
                    </form>
                </div>

                <div class="admin-list">
                    <h3>Recetas Registradas</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Tiempo</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>1</td>
                                <td>Milanesas con Puré</td>
                                <td>45 min</td>
                            </tr>
                            <tr>
                                <td>2</td>
                                <td>Tarta de Acelga</td>
                                <td>60 min</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
</body>
</html>
