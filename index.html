<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>MenuPlanner - Organización Semanal</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="https://kit.fontawesome.com/7745641707.js" crossorigin="anonymous"></script>
</head>
<body>
     <header>
        <div class="navbar">
            <h1>MenuPlanner</h1>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Login</a></li>
                    <li><a href="admin.html">Admin</a></li>
                    <li><a href="catalogo.html">Catálogo</a></li>
                    <li><a href="carrito.html">Mi Semana</a></li>
                    <li><a href="perfil.html">Mi Cuenta</a></li>
                    <li><button type="button" style="padding: 5px; background: #333; font-size:0.8em;">Modo Oscuro</button></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section id="login-view">
            <h2 class="section-title">Ingreso al Sistema</h2>
            <div class="alert-warning">
                <p><strong>Atención:</strong> No se detectaron usuarios registrados. Por favor, complete el formulario para crear el <em>primer usuario Administrador</em>.</p>
            </div>
            <form action="#" method="POST" style="max-width: 400px; margin: 0 auto;">
                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="user_email" required placeholder="ejemplo@correo.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="user_pass" required>
                </div>
                <button type="submit" style="width: 100%;">Iniciar Sesión / Crear Admin</button>
            </form>
        </section>
</main>
    <footer>
        <p><small>&copy; 2026 MenuPlanner. Trabajo Práctico Modularizado.</small></p>
    </footer>
</body>
</html>
