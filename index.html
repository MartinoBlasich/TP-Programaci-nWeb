<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso - Mi E-commerce</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="https://kit.fontawesome.com/7745641707.js" crossorigin="anonymous"></script>
</head>
<body>
    <!-- Tema Claro/Oscuro en Login también -->
    <header>
        <h1>Mi Tienda</h1>
        <button class="icon-btn" title="Alternar Tema Claro/Oscuro">🌓</button>
    </header>

    <main class="login-container">
        <h2>Iniciar Sesión</h2>
        <form action="catalogo.html"> <!-- Por ahora simula ir al catalogo -->
            <label for="usuario">Usuario / Email</label>
            <input type="text" id="usuario" placeholder="Ej: admin@tienda.com">
            
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="********">
            
            <button type="submit" style="width: 100%; margin-top: 15px;">Ingresar</button>
        </form>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid var(--border-color);">
        
        <h3>¿No hay usuarios?</h3>
        <p style="font-size: 0.9rem; margin-bottom: 10px;">El sistema detecta que no hay Administradores.</p>
        <button style="width: 100%; background-color: #28a745;">Crear Primer Administrador</button>
    </main>
</body>
</html>
